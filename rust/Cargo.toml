[workspace]
members = [
    "crates/openpgp-core",
    "crates/openpgp-policy",
    "crates/openpgp-card-adapter",
    "crates/openpgp-ffi",
    "tools/uniffi-bindgen",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
pgp = { version = "=0.21.0", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "ecdh"] }
rand = "=0.8.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
zeroize = "=1.9.1"
uniffi = "=0.32.2"
openpgp-card = { version = "=0.7.0", path = "../vendor/openpgp-card" }
openpgp-card-rpgp = { path = "../vendor/openpgp-card-rpgp" }
card-backend = "=0.2.0"

[patch.crates-io]
openpgp-card = { path = "../vendor/openpgp-card" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
